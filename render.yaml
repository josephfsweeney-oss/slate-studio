# Deploy on Render. One long-running Node process with a disk, so the portrait
# cache survives restarts and the rate limit is held in one place.
#
# Everything here is set for a public, read-only deployment. The only value you
# supply is the service-account key.
services:
  - type: web
    name: slate-studio
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /api/state
    disk:
      name: slate-state
      mountPath: /var/slate
      sizeGB: 1
    envVars:
      - key: SLATE_STATE_DIR
        value: /var/slate
      # Public and read-only: no writes, no Drive sign-in, no quota burning,
      # rate limited. Do not remove this unless the URL is private.
      - key: SLATE_PUBLIC
        value: "1"
      # The one value you paste: the whole service-account JSON key file.
      # Then share the slate folder with that account's email, as Viewer.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Uncomment to hide districts with a missing headshot. Off means the
      # PHOTO NEEDED tiles are public, which is usually the point.
      # - key: SLATE_PUBLIC_READY_ONLY
      #   value: "1"
